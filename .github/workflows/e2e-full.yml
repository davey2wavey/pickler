name: Full e2e

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *" # 4 am Eastern, 5 am during daylight time
  workflow_dispatch:

jobs:
  e2e:
    name: full e2e (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [site, runway, company-log]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.app }} exec playwright install --with-deps chromium
      # Runway reads and writes a database on every page. Start Supabase local
      # (migrations and seed apply on start) and point the build at it. No test
      # touches the hosted project.
      - name: Start local Supabase (runway)
        if: matrix.app == 'runway'
        run: |
          pnpm --filter @pickler/db exec supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta
          eval "$(pnpm --filter @pickler/db exec supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "RUNWAY_DEMO_PASSWORD=runway-demo" # the seed's demo password
          } >> "$GITHUB_ENV"
      # No PLAYWRIGHT_BASE_URL: Playwright builds and starts the app itself.
      - run: pnpm --filter ${{ matrix.app }} test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report
          retention-days: 7
